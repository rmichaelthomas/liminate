# Stated explicitly rather than left to pip's implicit setuptools fallback.
# There was no [build-system] table at all through 0.18.1: every build worked
# because pip supplies setuptools when a project names no backend, and
# setuptools auto-discovers a src/ layout. Both are conveniences, not
# guarantees, and a release build is the wrong place to rely on either.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "liminate"
version = "0.18.2"
description = "A prose-as-syntax language designed from the human end."
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "R. Michael Thomas" }
]
keywords = ["prose-as-syntax", "natural-language", "interpreter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Interpreters",
]

[project.urls]
Repository = "https://github.com/rmichaelthomas/liminate"

[project.scripts]
liminate = "liminate.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "hypothesis>=6.0"]
build = ["pyinstaller>=6.0"]
check = ["z3-solver>=4.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fuzzer: property-based differential fuzzer tests (may be slow)",
]
